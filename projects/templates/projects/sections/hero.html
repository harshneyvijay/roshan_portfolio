<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eae7e0;
        --surface: #eae7e0;
        --shadow-dark: #cbc6ba;
        --shadow-light: #ffffff;
        --ink: #262420;
        --muted: #6f6a60;
        --accent: #eb7900;
        --accent-2: #8a6b3f;
        --line: #d3cebf;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", sans-serif;
        overflow-x: hidden;
      }

      .mono {
        font-family: "IBM Plex Mono", monospace;
      }

      .hero {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: stretch;
        background: var(--bg);
      }

      /* faint index rule down the left, like a printer's registration mark */
      .hero::before {
        content: "";
        position: absolute;
        left: 96px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--line);
        z-index: 0;
      }

      .hero-inner {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 1320px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1.3fr 0.9fr;
        gap: 2rem;
        padding: 7rem 4rem 5rem 7.5rem;
      }

      /* ---------- left column ---------- */
      .intro-col {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .index-row {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        font-size: 0.78rem;
        letter-spacing: 0.06em;
        color: var(--muted);
        opacity: 0;
        animation: rise 0.6s ease forwards;
      }

      .index-row .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px rgba(53, 86, 79, 0.14);
      }

      .index-row .rule {
        width: 34px;
        height: 1px;
        background: var(--line);
      }

      .name-heading {
        margin: 1.3rem 0 0;
        font-family: "Fraunces", serif;
        font-optical-sizing: auto;
        font-weight: 500;
        letter-spacing: -0.01em;
        font-size: clamp(3.1rem, 5.6vw, 5.4rem);
        line-height: 0.96;
        color: var(--ink);
      }

      .name-heading .line {
        display: block;
        overflow: hidden;
      }

      .name-heading .line b {
        display: block;
        font-weight: 500;
        font-style: normal;
        transform: translateY(105%);
        opacity: 0;
        animation: reveal 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: 0.12s;
      }

      .role-row {
        display: flex;
        align-items: baseline;
        gap: 0.8rem;
        margin-top: 1.4rem;
        opacity: 0;
        animation: rise 0.6s ease forwards;
        animation-delay: 0.4s;
      }

      .role-title {
        font-size: 1.05rem;
        font-weight: 500;
        color: var(--ink);
      }

      .role-tag {
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.25rem 0.7rem;
      }

      .desc {
        margin: 1.5rem 0 0;
        max-width: 32rem;
        font-size: 1.02rem;
        line-height: 1.75;
        color: var(--muted);
        opacity: 0;
        animation: rise 0.6s ease forwards;
        animation-delay: 0.55s;
        overflow-wrap: break-word;
      }

      .cta-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1rem;
        margin-top: 2.3rem;
        opacity: 0;
        animation: rise 0.6s ease forwards;
        animation-delay: 0.7s;
      }

      .btn {
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-weight: 500;
        font-size: 0.92rem;
        padding: 0.95rem 1.7rem;
        border-radius: 12px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          color 0.2s ease;
      }

      .btn-primary {
        color: #f4f1ea;
        background: var(--accent);
        box-shadow:
          5px 5px 14px var(--shadow-dark),
          -3px -3px 10px var(--shadow-light);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow:
          7px 7px 18px var(--shadow-dark),
          -4px -4px 12px var(--shadow-light);
      }
      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-secondary {
        color: var(--ink);
        background: var(--surface);
        box-shadow:
          5px 5px 12px var(--shadow-dark),
          -5px -5px 12px var(--shadow-light);
      }
      .btn-secondary:hover {
        transform: translateY(-2px);
        color: var(--accent);
      }
      .btn-secondary:active {
        transform: translateY(0);
        box-shadow:
          inset 3px 3px 8px var(--shadow-dark),
          inset -3px -3px 8px var(--shadow-light);
      }

      .btn svg {
        width: 14px;
        height: 14px;
      }

      .social-row {
        display: flex;
        gap: 1.4rem;
        margin-top: 2.6rem;
        opacity: 0;
        animation: rise 0.6s ease forwards;
        animation-delay: 0.85s;
      }

      .social-link {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.8rem;
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        padding-bottom: 2px;
        transition:
          color 0.2s ease,
          border-color 0.2s ease;
      }
      .social-link:hover {
        color: var(--ink);
        border-color: var(--ink);
      }
      .social-link svg {
        width: 15px;
        height: 15px;
      }

      /* ---------- right column: badge-style photo ---------- */
      .photo-col {
        position: relative;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 1.5rem;
      }

      .photo-stage {
        position: relative;
        width: min(300px, 70vw);
        opacity: 0;
        animation: rise 0.8s ease forwards;
        animation-delay: 0.25s;
      }

      .photo-float {
        animation: float 7s ease-in-out infinite;
      }

      .photo-shell {
        position: relative;
        border-radius: 22px;
        background: var(--surface);
        box-shadow:
          16px 16px 34px var(--shadow-dark),
          -14px -14px 30px var(--shadow-light);
        padding: 14px;
      }

      .photo-inner {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 5;
        border-radius: 14px;
        overflow: hidden;
        box-shadow:
          inset 5px 5px 12px var(--shadow-dark),
          inset -5px -5px 12px var(--shadow-light);
        filter: grayscale(0.15);
      }

      .photo-inner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* museum-label style tag clipped to the bottom edge of the frame */
      .specimen-tag {
        margin-top: -10px;
        margin-left: 20px;
        width: calc(100% - 40px);
        background: var(--ink);
        color: #eae7e0;
        border-radius: 8px;
        padding: 0.6rem 0.9rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        box-shadow:
          6px 6px 14px var(--shadow-dark),
          -4px -4px 10px var(--shadow-light);
        position: relative;
        z-index: 3;
      }

      .specimen-tag span:last-child {
        color: #c9c2b3;
      }

      .coord-note {
        margin-top: 1.4rem;
        font-size: 0.72rem;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-align: right;
        padding-right: 0.4rem;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes reveal {
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }

      /* ---------- responsive ---------- */
      @media (max-width: 1024px) {
        .hero-inner {
          padding: 6rem 2.5rem 4rem 5.5rem;
        }
        .hero::before {
          left: 56px;
        }
      }

      @media (max-width: 860px) {
        .hero {
          min-height: 0;
          padding: 3rem 0;
        }
        .hero::before {
          display: none;
        }
        .hero-inner {
          grid-template-columns: 1fr;
          gap: 2.6rem;
          padding: 0 1.5rem;
        }
        .photo-col {
          order: 2;
          justify-content: flex-start;
          padding-top: 0;
        }
        .intro-col {
          order: 1;
        }
        .photo-stage {
          width: min(220px, 60vw);
        }
        .cta-row,
        .social-row {
          justify-content: flex-start;
        }
      }

      @media (max-width: 480px) {
        .name-heading {
          font-size: clamp(2.3rem, 11vw, 3rem);
        }
        .btn {
          padding: 0.85rem 1.4rem;
          font-size: 0.88rem;
        }
      }

      a,
      button {
        outline-offset: 3px;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
      }
    </style>
  </head>
  <body>
    <section class="hero" id="hero">
      <div class="hero-inner">
        <!-- LEFT: intro -->
        <div class="intro-col">


          <h1 class="name-heading">
            <span class="line"><b>{{ intro.name|default:"Roshan" }}</b></span>
          </h1>

          <div class="role-row">
            <span class="role-title">{{ intro.title|default:"Propulsion Engineer" }}</span>
          </div>

          <p class="desc">
            {{ intro.description|default:"I build" }}
          </p>

          <div class="cta-row">
            <a href="{{ intro.projects_url|default:'#projects' }}" class="btn btn-primary">
              View Projects  →
              
            </a>
            <a href="{{ intro.resume_url|default:'#resume' }}" class="btn btn-secondary" download>
              Download Resume
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
            </a>
          </div>

          <div class="social-row">
            <a href="{{ intro.linkedin_url|default:'#' }}" class="social-link">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.95v5.66H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
              LinkedIn
            </a>
            <a href="{{ intro.github_url|default:'#' }}" class="social-link">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.55v-2.15c-3.2.7-3.88-1.36-3.88-1.36-.53-1.33-1.28-1.69-1.28-1.69-1.05-.7.08-.69.08-.69 1.16.08 1.77 1.19 1.77 1.19 1.03 1.75 2.7 1.25 3.36.95.1-.74.4-1.25.73-1.53-2.56-.29-5.26-1.28-5.26-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.62 1.58.23 2.75.11 3.04.74.8 1.18 1.83 1.18 3.08 0 4.41-2.71 5.38-5.29 5.67.42.36.78 1.08.78 2.18v3.23c0 .3.2.66.8.55A11.5 11.5 0 0 0 12 .5z"/></svg>
              GitHub
            </a>
          </div>
        </div>

        <!-- RIGHT: photo, styled like a specimen card -->
        <div class="photo-col">
          <div class="photo-stage" id="photoStage">
            <div class="photo-float">
              <div class="photo-shell">
                <div class="photo-inner">
                  {% if intro and intro.photo %}
                  <img src="{{ intro.photo.url }}" alt="{{ intro.name }}" />
                  {% endif %}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script>
      (function () {
        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        if (reduceMotion) return;

        const hero = document.getElementById("hero");
        const stage = document.getElementById("photoStage");

        let targetX = 0,
          targetY = 0,
          curX = 0,
          curY = 0;

        hero.addEventListener("mousemove", (e) => {
          const rect = hero.getBoundingClientRect();
          const nx = (e.clientX - rect.left) / rect.width - 0.5;
          const ny = (e.clientY - rect.top) / rect.height - 0.5;
          targetX = nx * 10;
          targetY = ny * 8;
        });
        hero.addEventListener("mouseleave", () => {
          targetX = 0;
          targetY = 0;
        });

        function loop() {
          curX += (targetX - curX) * 0.06;
          curY += (targetY - curY) * 0.06;
          if (stage) stage.style.transform = `translate(${curX}px, ${curY}px)`;
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
